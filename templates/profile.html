{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="{% static 'profile.css' %}">
</head>
<body class="profile-page">
    <div class="header">
        <a class="back-link" href="{% url 'home' %}">Назад</a>
        <h1 class="header-title">Мой профиль</h1>
    </div>

    <div class="profile-card">
        {% include "avatar.html" with person=request.user size="big" %}
        <h2 class="profile-name">{{ request.user.first_name }}</h2>
        <p class="profile-username">@{{ request.user.username }}</p>
        <div class="profile-bio">
            <p class="profile-label">О себе</p>
            <p class="profile-bio-text">{{ request.user.bio|default:"Не указано" }}</p>
        </div>
        <a class="edit-profile-button" href="{% url 'edit_profile' %}">Редактировать профиль</a>
    </div>
</body>
</html>
