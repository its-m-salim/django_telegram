<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Добавить участников</h1>
    <form method="post">
        {% csrf_token %}
        {% for user in users %}
        <label>
            <input type="checkbox" name="users" value="{{ user.id }}"> @{{ user.username }}
        </label><br>
        {% empty %}
        <p>Все пользователи уже в группе</p>
        {% endfor %}
        <button type="submit">Добавить</button>
    </form>
</body>
</html>
