{% if person %}
    {% if person.avatar %}
    <div class="avatar avatar-{{ size }}">
        <img class="avatar-image" src="{{ person.avatar.url }}" alt="">
    </div>
    {% else %}
    <div class="avatar avatar-{{ size }} avatar-letter" style="style=background-color: {{ person.avatar_color|default:'#2a3f6b' }}">
        {{ person.first_name|default:person.username|default:person.title|first|upper }}    
    </div>
    {% endif %}
{% else %}
<div class="avatar avatar-{{ size }} avatar-deleted">?</div>
{% endif %}
