{% if person %}
    {% if person.avatar %}
    <div class="avatar avatar-{{ size }}">
        <img class="avatar-image" src="{{ person.avatar.url }}" alt="">
    </div>
    {% else %}
    <div class="avatar avatar-{{ size }} avatar-letter" style="background-color: {{ person.avatar_color }}">
        {{ person.first_name|default:person.username|first|upper }}
    </div>
    {% endif %}
{% else %}
<div class="avatar avatar-{{ size }} avatar-deleted">?</div>
{% endif %}
