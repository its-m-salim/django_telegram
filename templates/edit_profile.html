{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'edit_profile.css' %}">
</head>
<body>
    <div>
        <h1>Редактирования </h1>

        {% if error %}
        <p class="form-error">Выберите другое имя пользователя</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input class="form-input" type="text" name="username" placeholder="Имя пользователя" value="{{request.user.username}}" required>
            <input class="form-input" type="text" name="first_name" placeholder="Имя" value="{{request.user.first_name}}"  required>
            <label for="avatar">avatar</label>
            <input type="file" name="avatar" accept="image/*">
            <textarea name="bio" >{{request.user.bio|default:"Добавьте описание"}}</textarea>
            <button class="form-button" type="submit">Изменить</button>
            <a href="/profile">back</a>
        </form>
    </div>
</body>
</html>
