{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'chat.css' %}">

    <title>Document</title>
</head>
<body>
    <div class="chat_window">
        <div class="user">
            {% include "avatar.html" with person=other size="small" %}
            <p>{{other.name}}</p>
        </div>
        {% for message in chat_messages %}
        
        {% if  message.sender == request.user %}
        <div class="message">
            <p>{{message.text}}</p>
        </div>
        {% else %}
        <div class="message2">
            <p>{{message.text}}</p>
        </div>
        {% endif %}
        {% empty %}
        <p>no messages</p>
        {% endfor %}
        
    </div>
</body>
</html>
