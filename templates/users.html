<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% for user in users %}
    <div style="display: flex; width: 900px; margin: 0 auto; background-color: gray; color: white; padding: 20px 10px;" class="chat">
        <img src="{{user.avatar.url}}" alt="" width="40" height="40">
        <p>{{user.first_name}}</p>
        <p>{{user.username}}</p>

    </div>
    {% empty %}
    <p>no users detected </p>
    {% endfor %}
</body>
</html>
