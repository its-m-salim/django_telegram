<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Редактирование группы</h1>
    {% if error %}
    <h1>{{error}}</h1>
    {% endif %}
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="title" placeholder="имя группы" value="{{group.title}}" required>
        <textarea name="description" id="" placeholder="описание">{{group.description}}</textarea>
        <input type="file" name="avatar">
        
        <button type="submit">save</button>
    </form>
</body>
</html>
